name: Deploy

# Auto-deploy on every push to main: build the Docker image, push it to GHCR, then
# SSH into the VPS to `docker compose pull && up -d`. The VPS builds nothing — it pulls
# the ready image. The trained model is baked into the image (committed at
# models/vialvision_yolo26.pt), so a model update = commit new weights + push.
#
# Also runnable manually (Actions -> Deploy -> Run workflow) with a chosen `tag`,
# e.g. to roll back by re-deploying a previous tag/SHA.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build & deploy (e.g. latest, or a git SHA)"
        default: latest
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vialvision
  TAG: ${{ github.event.inputs.tag || 'latest' }}

jobs:
  build-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-push
    runs-on: ubuntu-latest
    # Optional: add required reviewers to the "production" environment in repo settings
    # to turn auto-deploy into approve-then-deploy.
    environment: production
    steps:
      - name: Pull & restart on the VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            export VIALVISION_TAG="${{ env.TAG }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
