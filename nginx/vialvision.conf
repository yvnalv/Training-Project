# nginx TLS termination + reverse proxy for VialVision.
# The app runs plain HTTP inside the compose network (service name "app").

# Needed so WebSocket upgrades (/ws live stream) proxy correctly.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed for local/PoC. On the VPS, swap for a real cert (Let's Encrypt).
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Rack photos can be a few MB — raise from nginx's 1 MB default.
    client_max_body_size 25m;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for the live-stream endpoint (/ws)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Inference + long-lived streams need generous timeouts
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
